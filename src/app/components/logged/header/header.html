<header class="header">
  <a class="logo" routerLink="/" aria-label="MovieFlix - início">
    <img ngSrc="/images/logo.png" width="180" height="48" alt="MovieFlix" priority />
  </a>

  <nav class="navigation" aria-label="Navegação principal">
    <a routerLink="/">Início</a>
    <a routerLink="/series">Séries</a>
    <a routerLink="/filmes">Filmes</a>
    <a routerLink="/originais">Originais</a>
    <a routerLink="/novidades">Novidades</a>
    <a routerLink="/novo-filme" routerLinkActive="active">Cadastrar filme</a>
  </nav>

  <form class="search" role="search">
    <label class="visually-hidden" for="movie-search">Buscar filmes e séries</label>
    <input id="movie-search" type="search" placeholder="Search" />
    <span class="search-icon" aria-hidden="true"></span>
  </form>

  <img class="profile-avatar" src="/images/profile.jpeg" width="40" height="40" alt="Perfil" />
</header>
