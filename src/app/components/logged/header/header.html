<header class="header">
  <a class="logo" routerLink="/" aria-label="MovieFlix - início">
    <img ngSrc="/images/logo.png" width="180" height="48" alt="MovieFlix" priority />
  </a>

  <nav id="main-navigation" class="navigation" [class.is-open]="menuOpen()" aria-label="Navegação principal">
    <a routerLink="/" (click)="closeMenu()">Início</a>
    <a routerLink="/series" (click)="closeMenu()">Séries</a>
    <a routerLink="/filmes" (click)="closeMenu()">Filmes</a>
    <a routerLink="/originais" (click)="closeMenu()">Originais</a>
    <a routerLink="/novidades" (click)="closeMenu()">Novidades</a>
    <a routerLink="/novo-filme" routerLinkActive="active" (click)="closeMenu()">Cadastrar filme</a>
  </nav>

  <form class="search" role="search">
    <label class="visually-hidden" for="movie-search">Buscar filmes e séries</label>
    <input id="movie-search" type="search" placeholder="Search" />
    <span class="search-icon" aria-hidden="true"></span>
  </form>

  <img class="profile-avatar" ngSrc="/images/profile.jpeg" width="40" height="40" alt="Perfil" />

  <button
    class="menu-toggle"
    type="button"
    aria-controls="main-navigation"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-label]="menuOpen() ? 'Fechar menu de navegação' : 'Abrir menu de navegação'"
    (click)="toggleMenu()"
  >
    <span aria-hidden="true"></span>
    <span aria-hidden="true"></span>
    <span aria-hidden="true"></span>
  </button>
</header>
