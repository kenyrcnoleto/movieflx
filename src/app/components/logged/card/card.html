<article class="movie-card">
	@if (movie().isTopTen) {
		<span class="top-badge" aria-label="Entre os 10 mais assistidos">TOP<br />10</span>
	}

	<h2>{{ movie().title }}</h2>
	<p class="description">{{ movie().description }}</p>

	<div class="metadata" aria-label="Informações do filme">
		<span>{{ movie().duration }}</span>
		<span>{{ movie().ageRating }}</span>
		<span>{{ movie().approval }} aprovação</span>
	</div>

	<span class="platform">{{ movie().platform }}</span>
</article>
