<section id="sign-up-container" class="container-fluid">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-7 col-xl-6">
      <div class="sign-up-panel">
        <h1>Cadastre-se</h1>

        <form class="sign-up-form">
          <div class="mb-3">
            <label class="visually-hidden" for="full-name">Seu nome completo</label>
            <input
              class="form-control"
              id="full-name"
              name="fullName"
              placeholder="Seu nome completo"
              type="text"
            />
          </div>
          <div class="mb-3">
            <label class="visually-hidden" for="email-or-phone">Seu melhor e-mail</label>
            <input
              class="form-control"
              id="email-or-phone"
              name="emailOrPhone"
              placeholder="Seu melhor e-mail"
              type="text"
            />
          </div>

          <div class="mb-3">
            <label class="visually-hidden" for="password">Sua senha</label>
            <input
              class="form-control"
              id="password"
              name="password"
              placeholder="Sua senha"
              type="password"
            />
          </div>

          <button class="btn w-100" type="submit">Entrar na conta</button>
        </form>

        <a class="forgot-password" href="/cadastre-se">Esqueci minha senha</a>

        <p class="sign-in-prompt">
          Já tem uma conta?
          <a  href="/login">Entre agora</a>
        </p>
      </div>
    </div>
  </div>
</section>
